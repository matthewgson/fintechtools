# ~/.config/tmux/tmux.conf — container multiplexer config (synced by sync_configs.sh)
#
# Keybindings mirror the Mac config (~/.config/tmux/tmux.conf) so the muscle
# memory is identical local vs. container. The container-specific bits are: the
# catppuccin theme is baked into the image and sourced directly (no TPM / no
# ~/.config plugin clone — keeps it on the fast node-local rootfs), the shell is
# zsh-login, and the clipboard uses OSC52 (yanks reach the Mac clipboard over SSH,
# in place of the Mac's pbcopy). Loaded from $XDG_CONFIG_HOME/tmux/tmux.conf.

# ─── Prefix: Ctrl+Space (Mac muscle memory) + Ctrl+b fallback ────────────────
# prefix2 = C-b ALSO triggers the prefix, so this (container) tmux stays reachable
# even when C-Space is captured before it gets here — e.g. an outer/local tmux you
# SSH'd from (nested tmux both using C-Space), or a terminal/OS shortcut. Use
# whichever key actually reaches this server.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix   # press Ctrl+Space twice to send a literal Ctrl+Space

# ─── Terminal / color ────────────────────────────────────────────────────────
# Truecolor comes from ghostty's own terminfo (xterm-ghostty, baked into the image
# — Dockerfile Stage 8h), which connect_nvim.sh sets as the real TERM. tmux 3.6b
# auto-detects RGB from it. COLORTERM=truecolor is also exported in zshenv.
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-ghostty:RGB"

# Extended keys: pass modified keys (Shift-Enter, Ctrl-Enter, …) through to the
# app instead of collapsing them to the unmodified key. This is what makes
# Shift-Enter insert a newline in Claude Code rather than submitting — which
# matters MORE here than on the Mac, since Claude runs in this container.
#
# Both lines are needed and they do different jobs: `extended-keys on` makes tmux
# emit the CSI-u encoding to the application, and the `extkeys` terminal-feature
# tells tmux the OUTER terminal understands that encoding. Without the second,
# tmux declines to send it. The `xterm*` pattern matches xterm-ghostty, so this
# holds whether TERM is the ghostty terminfo or a plain xterm-256color fallback.
# (This section used to claim no extended-keys setup was needed — that was wrong
# for modified keys; terminfo alone gets you RGB, not CSI-u passthrough.)
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# ─── Terminal image protocols (bookokrat / yazi / snacks.image) ──────────────
# Kitty-graphics escapes mean nothing to tmux, so apps wrap them in the
# passthrough sequence (\ePtmux;...\e\\) to reach Ghostty on the Mac. tmux
# DROPS those unless allow-passthrough is set, and the default is off.
#
# yazi and snacks.image each enable it for themselves with `tmux set -p`, so
# images worked in panes those two had already touched. bookokrat instead runs
#   tmux set allow-passthrough on
# with no -p. tmux exits 0 on that but files it as a session option, while
# allow-passthrough is a PANE option that nothing then reads back — a silent
# no-op. So a pane `bookokrat-split` opens for itself inherits the global off
# and its images never leave the pane. Setting it globally here covers every
# pane, present and future, in one place. Mirrors the Mac config's fix.
#
# This matters MORE over SSH than locally. bookokrat prefers Kitty
# shared-memory transmission, but the shm object it would write lives in
# /dev/shm on the compute node while Ghostty runs on the Mac — shared memory
# does not cross machines — so it falls back to chunked transfer, and every
# byte of the page then travels through this passthrough.
#
# `on`, not `all`: `on` allows passthrough only while the pane is VISIBLE.
# `all` keeps an off-screen pane writing to the terminal, which is how a
# background bookokrat repaints its page over the window you switched to.
set -g allow-passthrough on

# ─── Take bookokrat's PDF page off the screen when you switch away from it ───
# Under Ghostty, bookokrat draws the page as a CLASSIC Kitty placement,
# positioned from #{pane_top}/#{pane_left}. tmux holds no cell in its grid that
# stands for that image, so a window switch repaints the text and leaves the
# page painted over the window you switched TO (bookokrat#179). yazi and
# snacks.image are unaffected: they use Unicode placeholders, which are real
# tmux cells, and clean up after themselves.
#
# ~/.local/bin/tmux-kitty-image-gc writes the Kitty delete escape straight to
# the client tty — going around tmux's pane-visibility rules, which would
# swallow the same escape sent through a pane — then sends C-l to any reader
# still on screen so it repaints itself. The deletes are TARGETED at z-index -1
# and image id 1, which is where bookokrat draws and nowhere yazi does, so a
# preview in the neighbouring pane survives. It no-ops entirely unless a reader
# pane is actually running. The script explains the mechanism in full.
#
# Do NOT replace this with the old ~/.local/bin/override/bookokrat wrapper,
# which forced bookokrat's Unicode-placeholder anchor path on by answering its
# terminal probe with "kitty". Ghostty 1.3.1 does not implement the relative
# placements that path emits (Kitty keys P=/Q=): it drops them and paints the
# page wherever the cursor happens to be — on top of yazi, with the reader's
# own pane left empty. Retired on the Mac 2026-09-04; the same conclusion holds
# here, for the additional reason that the anchor path is implemented only over
# SHM transmission, which cannot reach a terminal on another machine.
#
# What is actually left for this hook is the reader that is VISIBLE BUT NOT
# FOCUSED — yazi on the left, page open on the right, cursor in yazi. bookokrat
# is told nothing about the switch, so its page stays on the terminal. With the
# reader focused, bookokrat cleans up on its own focus-out and this hook finds
# nothing to do. Measured 2026-09-07 on the Mac with the hook disabled: focused
# reader leaves 0 leftover pixels, unfocused reader leaves the whole page.
#
# Cost here is higher than on the Mac: the repaint is a full remote re-render
# and re-upload, ~1-1.5s rather than ~100-300ms. That is the SSH page floor,
# not a fault.
#
# NESTED tmux (a local tmux on the Mac, SSH'd from, with this tmux inside it):
# measured 2026-09-07 end to end with a real PDF. The page renders correctly
# through BOTH multiplexers, and nothing is left behind on an inner OR an outer
# session switch even with this hook removed entirely — the leak is a
# single-multiplexer phenomenon. So this hook is dead weight when nested and
# load-bearing in the ordinary connect_nvim.sh case (a bare ghostty window, no
# local tmux). Keep it; it costs nothing when there is nothing to collect.
#
# The nested arrangement has its own trap, and it is not this hook's: if you SSH
# in from inside a local tmux and DO NOT start tmux on this side, bookokrat sees
# no $TMUX, emits raw kitty escapes instead of wrapping them for passthrough,
# and the LOCAL tmux swallows them — the reader's frame and scrollbar draw and
# the page never appears at all. Start tmux here first (`tm`). Measured
# 2026-09-07; it looks like a failed PDF load, not a terminal problem.
#
# -b so the window switch is never held up waiting for the shell-out.
#
# Absolute path, not a bare name: run-shell hands the command to `sh -c`, whose
# PATH is whatever the tmux SERVER inherited at start — not the ~/.local/bin
# entry .zshrc adds for login shells. Single-quoted so tmux leaves $HOME for sh
# to expand. (Same trap bookokrat-split documents for its pane command.)
set-hook -g session-window-changed 'run-shell -b "$HOME/.local/bin/tmux-kitty-image-gc"'
set-hook -g client-session-changed 'run-shell -b "$HOME/.local/bin/tmux-kitty-image-gc"'

# ─── Responsiveness ──────────────────────────────────────────────────────────
set -sg escape-time 0       # no delay after <Esc> — critical for Neovim
# Also load-bearing for IMAGES, not just for nvim. bookokrat tears down its own
# Kitty placements when it receives a focus-out, so a reader you are FOCUSED on
# cleans up after itself; turn this off and the leftover-page bug returns in
# every case rather than only the unfocused one the hook above covers.
set -g focus-events on      # pass focus in/out to apps (nvim :autoread, lualine)
set -g history-limit 50000

# ─── Shell ───────────────────────────────────────────────────────────────────
# Spawn panes as a zsh LOGIN shell so /etc/zsh/zshenv + zshrc (PATH, starship,
# zoxide, aliases) are sourced. We set ONLY default-command, not default-shell:
# tmux's checkshell() validates default-shell via access(X_OK), which misreports
# /bin/zsh as "not a suitable shell" under udocker's fakechroot on `source-file`
# (aborting live reloads at that line). default-command runs `zsh -l` regardless
# of the base shell, so login panes still work and reloads no longer error.
set -g default-command "/bin/zsh -l"

# ─── Mouse + indexing ────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes too
set -g renumber-windows on     # keep window numbers gapless after closing one

# ─── Splits: default KEYS (" and %), but opening in the current directory ────
# 2026-08-10: the custom `|` / `-` splits are gone, matching the Mac config.
#
# The key and the working directory are independent choices, so keep the default
# keys without inheriting tmux's default CWD. Out of the box `"` and `%` open the
# SESSION's default directory (usually ~), which is why a split stopped landing
# in the pwd once the old `| / -` bindings — which carried -c — were removed.
# Re-binding the same keys to the same commands, only with -c, gets the pwd
# behaviour back and changes nothing about what you press.
#
# Matching tmux's own defaults exactly: `"` splits vertically (stacked, -v is
# implicit) and `%` splits horizontally (-h). Getting those backwards is the easy
# mistake here — the glyphs look like the opposite of what they do.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# ─── Seamless nav: Ctrl+h/j/k/l across nvim splits AND tmux panes ─────────────
# Needs christoomey/vim-tmux-navigator on the nvim side (shipped in LazyVim here).
# The check sees if the active pane runs (n)vim/fzf; if so the key passes through
# to nvim, otherwise tmux switches panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
# Same keys also work while in copy mode:
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# Ctrl+l used to clear the screen — get it back via prefix Ctrl+l:
bind C-l send-keys 'C-l'

# ─── Prefix-based pane navigation (fallback): prefix then h/j/k/l ─────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Resize: prefix then H/J/K/L (repeatable, hold to keep resizing) ─────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Copy mode: vi keys, v to select, y to yank ──────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# OSC52: y also reaches the *Mac* clipboard through the SSH terminal (ghostty/
# kitty), the container-side equivalent of the Mac config's `pbcopy` pipe.
set -g set-clipboard on

# ─── Double-click a URL ──────────────────────────────────────────────────────
# Mirrors the Mac binding, with ONE unavoidable difference: it copies instead of
# opening. The Mac ends in `copy-pipe-and-cancel "xargs open"`, and `open` is
# macOS-only — but the deeper problem is that the click happens HERE while the
# browser is on the Mac, and nothing connects the two. (A mac-open bridge existed
# once and was deliberately removed; reinstating it is the only route to a real
# remote open, and it is not worth a reverse channel for this.) So the URL goes
# to the Mac clipboard over OSC52 — set-clipboard above — and you paste it.
#
# The rest is the Mac's logic verbatim, and it is the part that carries its
# weight: `mouse on` makes tmux swallow clicks before ghostty can act on them,
# and the URL-friendly word-separators let a double-click select the WHOLE url
# rather than stopping at "https". Non-URL words keep the normal
# select-and-copy. Tip: holding Shift while clicking bypasses tmux's mouse
# reporting entirely and hands the click to ghostty, which may open the link
# natively — worth trying before reaching for the paste.
set -g word-separators " ()[]{}<>"
bind -n DoubleClick1Pane {
    select-pane -t =
    if-shell -F "#{m:*://*,#{mouse_word}}" {
        copy-mode -H
        send-keys -X select-word
        send-keys -X copy-pipe-and-cancel
        display-message "URL copied to the Mac clipboard — paste it in your browser"
    } {
        if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" {
            send-keys -M
        } {
            copy-mode -H
            send-keys -X select-word
            run-shell -d 0.3
            send-keys -X copy-pipe-and-cancel
        }
    }
}

# ─── Floating scratch terminal ───────────────────────────────────────────────
# prefix g -> floating popup attached to a persistent 'scratch' session. State
# persists between toggles. Close with `prefix d` (keeps it) or `exit` (destroys).
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E \
  "tmux new-session -A -s scratch"

# ─── Quality of life ─────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ─── Status bar: Catppuccin (mocha) — mirrors the Mac ────────────────────────
# Baked into the image at /usr/local/share/tmux-plugins/catppuccin (Dockerfile)
# and sourced directly — no TPM, no ~/.config plugin clone, so it stays on the
# fast node-local rootfs and adds no plugin-manager handshake at launch.
set -g status-position top
set -g status-interval 5

# Catppuccin (v2) options — must be set BEFORE the theme is sourced.
set -g @catppuccin_flavor 'mocha'           # latte | frappe | macchiato | mocha
# Rounded caps. window_status_style is "custom" because every built-in style
# sets the separators with `set -gq` (overwrites), and "rounded" draws its caps
# with "#[fg=#{@_ctp_status_bg},reverse]", which needs a concrete colour and
# leaves a hard edge. "custom" matches no branch, so catppuccin sets nothing and
# these survive: a plain cap glyph with an explicit fg over bg=default, which
# inside the status line resolves to the bar tint below.
#
# All six are set explicitly. Catppuccin derives the current_* trio with
# `set -ogqF` (-o = do not overwrite), so on an already-sourced server they keep
# whatever they held before and the ACTIVE window silently keeps old separators
# while every other window updates.
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator          "#[bg=default,fg=#{@catppuccin_window_text_color}]"
set -g @catppuccin_window_middle_separator         " "
set -g @catppuccin_window_right_separator         "#[bg=default,fg=#{@catppuccin_window_number_color}]"
set -g @catppuccin_window_current_left_separator  "#[bg=default,fg=#{@catppuccin_window_current_text_color}]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@catppuccin_window_current_number_color}]"

# Module caps: a real closing glyph plus the #[bg=default] reset between
# modules. Catppuccin ships the right separator as a plain SPACE with
# connect_separator "yes", so a module never closes and its surface0 background
# runs on under the next module's coloured cap.
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Muted accents. The bar is transparent, so the pills are the only solid colour
# on it — an explicit background is exempt from Ghostty's background-opacity
# (cells is off), so they paint fully opaque. At full Catppuccin strength that
# reads too loud, so they are pre-blended toward the old bar tone:
#     blended = accent * (1 - a) + #181825 * a      with a = 0.25
#     a=0.15  green #91c58e  mauve #b091d8  yellow #d7c49a  red #d27a94
#     a=0.25  green #82b082  mauve #9e82c2  yellow #c1b08c  red #bc6e87   <- here
#     a=0.35  green #749c76  mauve #8c74ae  yellow #aa9b7f  red #a6637a
# Full strength belongs with an opaque bar, not this one.
set -g @catppuccin_session_color "#{?client_prefix,#bc6e87,#82b082}"
set -g @catppuccin_window_current_number_color "#9e82c2"
set -g @catppuccin_host_color "#9e82c2"

# Show tmux's window flags as icons on each window entry, same as the Mac.
# Default is "none", which means a ZOOMED pane looks exactly like an unzoomed
# one in the bar — the usual "why is my layout broken" moment. Also covers the
# current/last window, bell, activity, silence and marked.
set -g @catppuccin_window_flags "icon"

set -g @catppuccin_status_connect_separator "no"

# Let each module's text carry that module's accent instead of white-on-grey.
# Session text tracks the session icon, so the whole left pill turns red while
# the prefix is held — a far bigger prefix cue than the icon alone.
set -g @catppuccin_status_session_text_fg "#{?client_prefix,#bc6e87,#82b082}"

# Load the theme (provides the #{E:@catppuccin_status_*} modules used below).
# Guarded so tmux started where the image path is absent just falls back cleanly.
if-shell '[ -f /usr/local/share/tmux-plugins/catppuccin/catppuccin.tmux ]' \
  "run '/usr/local/share/tmux-plugins/catppuccin/catppuccin.tmux'"

# Assemble the bar from Catppuccin modules AFTER the theme loads.
set -g status-left ""

# Custom module: how long ago the session was last saved BY HAND (prefix
# Ctrl-s), same as the Mac. Persistence is manual (continuum is not loaded), so
# without it nothing warns you that prefix Ctrl-r would restore a stale layout.
# The age comes from ~/.local/bin/tmux-resurrect-age (deployed by
# sync_configs.sh, shared with the Mac), which colours its text green/yellow/red.
#
# Sourced here, after catppuccin has loaded, because the module builder needs
# the theme's @thm_* colours and separators to already exist. `source` does NOT
# expand ~, so the path is resolved relative to this file; #{d:current_file}
# needs -F to be expanded at all.
source -F "#{d:current_file}/modules/resurrect.conf"

# The right-hand side carries the HOST, which the Mac's bar does not. The two
# bars are otherwise identical, so without this there is nothing on screen to
# tell you whether the tmux you are typing into is the Mac's or the one on the
# compute node at the far end of an SSH pipe — a genuinely expensive mistake
# when the next command is `rm` or a job submission.
#
# No clock: same reasoning as the Mac, the terminal already shows one.
# To put it back:  set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_session}"
# A space between the two pills. Catppuccin has no inter-module gap option —
# connect_separator only controls whether a module closes with a bg reset —
# so the modules butt together unless one is inserted here. It inherits the
# preceding #[bg=default], so the gap is transparent like the rest of the bar.
# Matches window-status-separator, which is already a single space.
set -ag status-right " "
set -ag status-right "#{E:@catppuccin_status_resurrect}"
# Host last: session | save age reads the same as the Mac bar, host is the extra.
set -ag status-right " "
set -ag status-right "#{E:@catppuccin_status_host}"

# Bar background: transparent.
#
# bg=default means these cells carry no explicit background, so they take the
# window's background-opacity (0.7) and blur instead of painting a band. Set
# AFTER catppuccin loads, deliberately: @_ctp_status_bg must keep a real colour,
# and setting @catppuccin_status_background to "#{l:default}" instead makes the
# window caps reverse against the FOREGROUND default, giving bright #cdd6f4
# blocks. Tested.
#
# fg is mocha's @thm_text spelled out rather than "#{E:@thm_fg}": if the theme
# has not loaded (the container guards its catppuccin path) that format expands
# to empty, the whole set is rejected, and the bar reverts to tmux's green.
#
# If this ever goes back to an opaque tinted band, the tuned value was #20102b
# (violet, 1.43x contrast against the #313244 pill bodies) and the accents below
# must go back to full strength at the same time.
set -g status-style "bg=default,fg=#cdd6f4"

# ─── Command prompt must REPLACE the status bar, not float over it ───────────
# Catppuccin ships message-style / message-command-style as
# "fg=<teal>,bg=default,align=centre" — no `fill=`. Without a fill colour tmux
# paints only the cells the message text itself occupies, and align=centre puts
# those cells in the MIDDLE of the line, so every prompt (prefix , to rename a
# window, prefix $, prefix :) is drawn ON TOP of the status bar: window list
# still on the left, session + clock still on the right, prompt floating
# between them. Stock tmux avoids this with fill= (its default message-style is
# bg=yellow,fg=black,fill=yellow); restoring fill= plus align=left gives back a
# full-width prompt line that covers the bar, in Catppuccin colours.
#
# Two-tone on purpose, matching stock tmux: message-style is the prompt in
# INSERT mode, message-command-style is the same prompt after Esc in vi normal
# mode (status-keys is vi, so Esc does NOT cancel — C-c does).
#
# Must come after the point where Catppuccin sets these, i.e. after it loads.
# Mauve, not Catppuccin's stock teal (#94e2d5) — the teal reads as a mint
# green and is easily mistaken for tmux's own default green prompt. This is
# the same muted mauve the window-number chip uses, so the prompt matches the
# bar. For a brighter prompt use @thm_mauve #cba6f7 in both lines.
set -g message-style         "fg=#1e1e2e,bg=#9e82c2,align=left,fill=#9e82c2"
set -g message-command-style "fg=#9e82c2,bg=#313244,align=left,fill=#313244"

# ─── Session persistence: resurrect (manual only) ────────────────────────────
#   prefix Ctrl-s  save now        prefix Ctrl-r  restore last save
#
# Save and restore are deliberately manual: continuum (the autosave timer and
# the auto-restore-on-server-start hook) is not loaded here, same as the Mac.
#
# Mirrors the Mac, minus TPM. The Mac loads resurrect through TPM; this file
# sources it directly, exactly as catppuccin above, because a plugin manager on
# the network home costs a handshake at every tmux start for no benefit here.
#
# Saved state lives on the NETWORK home (~/.local/share/tmux/resurrect), NOT on
# node-local /tmp — that is the whole point on this cluster: a saved layout
# survives the node changing under you, which is when you actually want it back.
# @resurrect-dir is set explicitly rather than trusting XDG_DATA_HOME, which the
# image sets to the BUILD-time home path (/home/gson) while the runtime home is
# bind-mounted elsewhere (/home/g/gson) — resurrect would otherwise try to write
# to a directory that does not exist at runtime.
set -g @resurrect-dir "~/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'   # keep scrollback in each pane
set -g @resurrect-strategy-nvim 'session'      # restore nvim via its own session file

# Guarded on its own path so a container built before resurrect was baked in
# still starts cleanly — it just has no persistence. The $HOME fallback covers
# exactly that case without a rebuild; it is redundant once the image carries it.
if-shell '[ -f /usr/local/share/tmux-plugins/tmux-resurrect/resurrect.tmux ]' \
  "run '/usr/local/share/tmux-plugins/tmux-resurrect/resurrect.tmux'" \
  "if-shell '[ -f ~/.local/share/tmux-plugins/tmux-resurrect/resurrect.tmux ]' \
     \"run '~/.local/share/tmux-plugins/tmux-resurrect/resurrect.tmux'\""

# ─── No separator rule ───────────────────────────────────────────────────────
# The bar is a single line with no rule beneath it. A rule was tried at length
# and rejected; if it is ever wanted again, commit c2b86d9 (dotfiles) /
# 5865c95 (05_Container) carries the working version.
#
# What was learned, so it is not re-derived:
#   - A rule on its own status row costs exactly one text row (42px at this
#     font size). A status line is one cell tall and tmux has no sub-row
#     sizing, so the glyph only chooses where the line sits inside that row:
#     U+2594 top, U+2500 / U+203E centre, U+2581 bottom.
#   - Drawing it in-row instead (bar style carrying `underscore` + `us=`)
#     costs 0px but lands INSIDE the pill backgrounds — a cell background
#     fills its whole height, so no position in that row is clear of a pill —
#     and the rounded cap glyphs nick it 7 times.
