# vim:set ft=tmux:
# Custom Catppuccin status module: age of the last MANUAL tmux-resurrect save.
#
# The container's copy of the Mac's ~/.config/tmux/modules/resurrect.conf. Only
# the builder path differs: the Mac finds catppuccin under TPM's plugins/tmux/,
# the image bakes it at /usr/local/share/tmux-plugins/catppuccin/. The builder
# is sourced with -q so an image without catppuccin (tmux.conf guards the theme
# the same way) starts cleanly and simply shows no save-age pill.
#
# Kept in its own file, mirroring the layout of catppuccin's own status/*.conf,
# because that is the only arrangement that actually works: %hidden variables
# are parse-time and file-scoped, so MODULE_NAME has to be declared in the same
# file that sources status_module.conf. Declaring it in tmux.conf and sourcing
# the builder from there parses without error and silently builds nothing.
%hidden MODULE_NAME="resurrect"

set -ogq  "@catppuccin_${MODULE_NAME}_icon"  "󰆓 "
# Muted yellow, matching the blended accents in tmux.conf (a = 0.25).
set -ogq  "@catppuccin_${MODULE_NAME}_color" "#c1b08c"
# ~/.local/bin/tmux-resurrect-age is deployed by sync_configs.sh (shared with
# the Mac). It reads ~/.local/share/tmux/resurrect/last, which is where
# @resurrect-dir in tmux.conf puts the saves.
set -ogq  "@catppuccin_${MODULE_NAME}_text"  " #(~/.local/bin/tmux-resurrect-age)"

source -q "/usr/local/share/tmux-plugins/catppuccin/utils/status_module.conf"
