# configs/yazi/yazi.toml — synced to CIRCE ~/.config/yazi/ by sync_configs.sh.
#
# PDFs open in farleaf (terminal reader) in a half herdr split beside yazi, via
# the farleaf-split helper in ~/.local/bin (same file the Mac runs; see its
# header for the reuse logic). Images preview in-terminal via yazi's built-in
# graphics; other types use yazi's defaults.

[opener]
# Use %s, never the shell positional form: yazi deprecated $n and $@ in
# v25.12.29 in favour of its own shell formatting, and by 26.x they are gone.
# (The container ships yazi 26.5.6, so they ARE gone here.) The opener still
# RUNS, it just receives an empty argument. Combined with `orphan = true`, which
# sends the child's stdout and stderr to /dev/null, that fails in total silence
# — pressing `o` spawns farleaf-split with no file, its ${1:?} usage guard
# aborts, and nothing whatsoever appears on screen. yazi expands %s to the
# selected paths (the hovered one when nothing is selected) and shell-quotes
# them itself, so it must NOT be wrapped in quotes.
farleaf = [
  # Open in farleaf (terminal reader) in a half split beside this pane: hover
  # the PDF on the left, read it on the right. Opening a second PDF swaps the
  # file in the reader pane rather than splitting again.
  { run = 'farleaf-split %s', desc = "farleaf (half split)", orphan = true },
]
mac = [
  # Safari on the Mac, through the tunnels connect_nvim.sh sets up: mac-open
  # serves the page from this node, so its relative assets (Quarto's *_files/)
  # load, and a reload in Safari shows a re-render. Not orphan, so a failure
  # (say, a connection made without connect_nvim.sh) stays readable in the task
  # list (`w`) instead of going to /dev/null.
  { run = 'mac-open %s', desc = "Safari (on the Mac)" },
]

[open]
# No `open`/`reveal` fallbacks in the list the way the Mac has them: those are
# macOS `open(1)`, which does not exist in the container. HTML is the one type
# that still reaches the Mac, through mac-open. farleaf is the only PDF viewer
# on this side — there is no X11 and no display to send one to. (EPUBs have no
# reader here since bookokrat left; farleaf reads PDFs only.)
prepend_rules = [
  { url = "*.pdf",  use = "farleaf" },
  { url = "*.html", use = "mac" },
  { url = "*.htm",  use = "mac" },
]
